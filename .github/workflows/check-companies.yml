name: Check company boards

# Runs by itself whenever companies.yaml changes, and from the "Run workflow"
# button. It tests every company's job board (no AI, no email, no secrets) and,
# for any that fail, searches for the right platform/slug.

on:
  push:
    paths:
      - "job-alerts/companies.yaml"
      - "job-alerts/job_alerts.py"
  workflow_dispatch:
    inputs:
      search_for:
        description: "Optional: company names to look up (e.g. Rocket Lab, Planet). Separate with commas."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: job-alerts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test every board in companies.yaml
        env:
          SEARCH_FOR: ${{ inputs.search_for }}
        run: |
          names=()
          IFS=',' read -ra parts <<< "${SEARCH_FOR:-}"
          for n in "${parts[@]}"; do
            n="$(echo "$n" | xargs)"; [ -n "$n" ] && names+=("$n")
          done
          if [ ${#names[@]} -gt 0 ]; then
            python job_alerts.py --check --probe "${names[@]}"
          else
            python job_alerts.py --check
          fi
